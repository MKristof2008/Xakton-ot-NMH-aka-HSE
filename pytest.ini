[pytest]
# Async-тесты в этом проекте запускает собственный хук в ml/conftest.py
# (pytest_pyfunc_call), без плагина pytest-asyncio. Маркер объявлен здесь,
# чтобы pytest не сыпал PytestUnknownMarkWarning на каждый такой тест.
markers =
    asyncio: асинхронный тест, запускается хуком из ml/conftest.py

testpaths = ml autopilot/tests
